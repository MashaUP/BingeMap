<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<title>BingeMap</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{width:380px;min-height:300px}
  .pop{display:flex;flex-direction:column}

<div class="pop" id="pop"></div>

</body>
</html>
