name: Release

# Alla pubblicazione di una Release: controlli, test, zip installabile allegato e annuncio su Discord.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dipendenze di sviluppo
        run: npm install --no-audit --no-fund
      - name: Controllo versione e manifest
        run: node scripts/check.mjs
      - name: Test unitari
        run: npm test
      - name: Pacchetto
        run: bash scripts/pacchetto.sh
      - name: Allega lo zip alla Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" BingeMap-*.zip --clobber
      - name: Annuncio su Discord
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "Segreto DISCORD_WEBHOOK assente: annuncio saltato"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          body = (os.environ.get("BODY") or "").strip()[:1500]
          msg = {"username": "BingeMap", "embeds": [{"title": f"BingeMap {os.environ['TAG']} disponibile", "url": os.environ["URL"], "description": body or "Nuova versione pubblicata.", "color": 0x6D4AFF}]}
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], data=json.dumps(msg).encode(), headers={"Content-Type": "application/json", "User-Agent": "BingeMap-release"})
          urllib.request.urlopen(req, timeout=20)
          print("Annuncio inviato")
          PY
