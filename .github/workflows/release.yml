# Quando pubblichi una release su GitHub, questo workflow controlla e testa il codice, crea
# BingeMap-x.y.z.zip e il suo .sha256, li allega alla release e annuncia la release su Discord.
# Rilanciarlo (o modificare la release) sostituisce lo zip, non ne aggiunge un secondo.
name: Zip della release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release a cui allegare lo zip (es. v1.3.2)"
        required: true
      salta_test:
        description: "Allega lo zip anche se i test falliscono"
        type: boolean
        default: false
      annuncia_discord:
        description: "Annuncia la release anche su Discord"
        type: boolean
        default: false

# Solo quello che serve: leggere il codice e allegare un file alla release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Codice della release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Dipendenze di sviluppo
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Tag nel formato vx.y.z
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Il tag $TAG non è nel formato vx.y.z"; exit 1; }

      - name: Controlli (versioni, manifest, link, segreti), lint e test di unità
        if: ${{ !inputs.salta_test }}
        run: npm test

      - name: Zip (cartella BingeMap/, solo i file dell'estensione) e SHA-256
        id: zip
        run: |
          bash scripts/pacchetto.sh "$TAG" "$RUNNER_TEMP/dist"
          # Lo zip è riproducibile: deve coincidere con quello nella radice, che «Cerca aggiornamento» scarica.
          atteso=$(node -p "require('./version.json').sha256")
          if [ "$(cut -d' ' -f1 "$RUNNER_TEMP/dist/"*.sha256)" != "$atteso" ]; then
            echo "::warning::Lo zip costruito qui ha un SHA-256 diverso da version.json: lo zip nella radice potrebbe non corrispondere al codice (rifai npm run package)."
          fi

      - name: Allega alla release (sostituisce uno zip con lo stesso nome)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "${{ steps.zip.outputs.percorso }}" "${{ steps.zip.outputs.percorso }}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Allegati ${{ steps.zip.outputs.nome }} e ${{ steps.zip.outputs.nome }}.sha256 alla release $TAG" >> "$GITHUB_STEP_SUMMARY"

      # Annuncio su Discord: serve il secret DISCORD_WEBHOOK_URL (Settings › Secrets and variables › Actions),
      # lo stesso nome degli altri progetti (vale anche il vecchio DISCORD_WEBHOOK). Alla pubblicazione di una
      # release sempre; rilanciando a mano solo con «Annuncia la release anche su Discord». Titolo e note dalla release.
      - name: Annuncia su Discord
        if: ${{ github.event_name == 'release' || inputs.annuncia_discord }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.nome }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Secret DISCORD_WEBHOOK_URL non impostato: niente annuncio su Discord."
            exit 0
          fi
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*|https://ptb.discord.com/api/webhooks/*|https://canary.discord.com/api/webhooks/*) ;;
            *) echo "::error::DISCORD_WEBHOOK_URL non sembra l'URL di un webhook di Discord (deve iniziare con https://discord.com/api/webhooks/)."; exit 1 ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          jq -n --slurpfile r release.json --arg zip "$ZIP" --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" '
            ($r[0]) as $r |
            {
              username: "BingeMap",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: (($r.name // "") | if . == "" then "BingeMap \($tag)" else . end)[0:250],
                url: $r.url,
                description: ((($r.body // "") | if length > 3500 then .[0:3500] + "…" else . end)
                  + "\n\n**Scarica:** [\($zip)](https://github.com/\($repo)/releases/download/\($tag)/\($zip))"),
                color: 7162623
              }]
            }' > discord.json
          codice=$(curl -sS -o risposta.txt -w '%{http_code}' -H 'Content-Type: application/json' --data @discord.json "${DISCORD_WEBHOOK_URL%%\?*}?wait=true")
          if [ "$codice" != "200" ] && [ "$codice" != "204" ]; then
            echo "::error::Discord ha risposto $codice: $(head -c 300 risposta.txt)"
            exit 1
          fi
          echo "Annunciata su Discord" >> "$GITHUB_STEP_SUMMARY"
