name: Proponi un'idea
description: Una funzione nuova o un miglioramento per BingeMap
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Che problema risolve
      description: "Raccontalo dal tuo punto di vista: cosa fai oggi, cosa ti manca o ti fa perdere tempo."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Come te la immagini
      description: "Dove comparirebbe (popup, dashboard, app web) e cosa farebbe."
  - type: textarea
    id: alternative
    attributes:
      label: Alternative che hai provato
